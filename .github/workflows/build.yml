name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]" -c constraints.txt

      - name: Bundle Node.js
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "packaging\node" | Out-Null
          Invoke-WebRequest -Uri "https://nodejs.org/dist/latest-v22.x/win-x64/node.exe" `
            -OutFile "packaging\node\node.exe" -UseBasicParsing
          if (-not (Test-Path "packaging\node\node.exe")) { throw "No se descargó Node.js" }

      - name: Build executable
        run: |
          python packaging\make_icon.py
          python -m PyInstaller --noconfirm --clean sound.spec

      - name: Self-test the executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\Sound\Sound.exe")) { throw "No se generó Sound.exe" }
          $env:SOUND_NO_MIGRATE = "1"
          $env:SOUND_DATA_DIR = "$env:RUNNER_TEMP\SoundSelfTest"
          $p = Start-Process "dist\Sound\Sound.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Sound.exe --self-test salió con $($p.ExitCode)" }
          $log = Join-Path $env:SOUND_DATA_DIR "sound.log"
          if (-not (Test-Path $log)) { throw "El autotest no creó $log" }
          Get-Content $log

      - name: Zip portable build
        shell: pwsh
        run: |
          $version = (Select-String -Path "app\__init__.py" -Pattern '__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          Compress-Archive -Path "dist\Sound\*" -DestinationPath "dist\Sound-$version-windows.zip"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $version = (Select-String -Path "app\__init__.py" -Pattern '__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          $iscc = @(
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "No se encontró ISCC.exe" }
          & $iscc "/DMyAppVersion=$version" "installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC falló con $LASTEXITCODE" }

      # La app solo instala sola una versión cuyo instalador coincide con esta suma
      - name: Checksum installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem "dist\Sound-*-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "No se generó el instalador" }
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$($setup.FullName).sha256" -Value "$hash  $($setup.Name)" -Encoding ascii -NoNewline
          Get-Content "$($setup.FullName).sha256"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sound-windows-${{ github.sha }}
          path: |
            dist/Sound-*-windows.zip
            dist/Sound-*-setup.exe
            dist/Sound-*-setup.exe.sha256
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python, Tk, PyGObject and GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-tk python3-gi python3-gi-cairo \
            gir1.2-glib-2.0 gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav \
            gstreamer1.0-pulseaudio gstreamer1.0-alsa
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --upgrade pip
          # --ignore-installed: que Pillow y compañía salgan de pip (con ImageTk), no del sistema
          .venv/bin/pip install --ignore-installed -e ".[dev]" -c constraints.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Bundle Node.js
        run: |
          mkdir -p packaging/node
          cp "$(command -v node)" packaging/node/node

      - name: Build, self-test and package
        env:
          PYTHON: .venv/bin/python
        run: bash packaging/build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sound-linux-${{ github.sha }}
          path: |
            dist/Sound-*-linux-*.tar.gz
            dist/Sound-*-linux-*.tar.gz.sha256
          if-no-files-found: error

  # Un solo job publica: así Windows y Linux no compiten por crear la release.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Las notas de la versión son su apartado del CHANGELOG: Sound las resume al avisar
      - name: Release notes
        shell: bash
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' app/__init__.py)"
          python3 - "$version" <<'PY'
          import pathlib
          import re
          import sys

          version = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          found = re.search(rf"(?ms)^## {re.escape(version)}\b[^\n]*\n(.*?)(?=^## |\Z)", text)
          notes = found.group(1).strip() if found else ""
          pathlib.Path("dist/release-notes.md").write_text(notes, encoding="utf-8")
          print(notes)
          PY

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Sound-*-setup.exe
            dist/Sound-*-setup.exe.sha256
            dist/Sound-*-windows.zip
            dist/Sound-*-linux-*.tar.gz
            dist/Sound-*-linux-*.tar.gz.sha256
          body_path: dist/release-notes.md
          generate_release_notes: true
