name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]" -c constraints.txt
      - name: Lint
        run: python -m ruff check app tests
      - name: Run tests
        run: python -m pytest -q

  pytest-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python, Tk y un entorno virtual
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-tk
          python3 -m venv .venv
          .venv/bin/pip install -e ".[dev]" -c constraints.txt
      - name: Lint
        run: .venv/bin/ruff check app tests
      - name: Run tests
        run: .venv/bin/pytest -q
